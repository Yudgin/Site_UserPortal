<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bait Boat Portal</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Safari-фикс: у части устройств завис старый service worker прежней версии сайта и
         вечно отдаёт устаревшую оболочку из кэша. Снимаем все SW и чистим Cache Storage;
         после первой удачной загрузки страница один раз перезагрузится начисто. -->
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var had = regs.length > 0
              return Promise.all(regs.map(function (r) { return r.unregister() })).then(function () {
                if ('caches' in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                  }).then(function () { return had })
                }
                return had
              })
            }).then(function (had) {
              if (had && !sessionStorage.getItem('sw-purged')) {
                sessionStorage.setItem('sw-purged', '1')
                location.reload()
              }
            }).catch(function () {})
          }
        } catch (e) { /* ignore */ }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
